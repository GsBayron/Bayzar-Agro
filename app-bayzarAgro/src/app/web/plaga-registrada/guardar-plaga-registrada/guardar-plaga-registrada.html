<div class="module-page">

    <div class="module-header mb-4">

        <div>
            <div class="header-badge mb-2">
                <i class="bi bi-bug"></i>
                Catálogo agrícola
            </div>

            <h3 class="fw-bold mb-1">
                Nueva plaga registrada
            </h3>

            <p class="text-muted mb-0">
                Registre información de referencia sobre una plaga agrícola.
            </p>
        </div>

        <button type="button" class="btn btn-outline-secondary btn-sm" routerLink="/app/plagas-registradas">

            <i class="bi bi-arrow-left me-1"></i>
            Volver

        </button>

    </div>

    <div class="card module-card border-0 shadow-sm">

        <div class="card-body p-4">

            <form [formGroup]="form" (ngSubmit)="guardar()">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">
                            Nombre común
                        </label>

                        <input type="text" class="form-control" formControlName="nombre_comun"
                            placeholder="Ej: Mosca blanca"
                            [class.is-invalid]="f['nombre_comun'].touched && f['nombre_comun'].invalid">

                        @if(f['nombre_comun'].touched && f['nombre_comun'].invalid) {
                        <small class="text-danger">
                            El nombre común es requerido.
                        </small>
                        }
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Nombre científico
                        </label>

                        <input type="text" class="form-control" formControlName="nombre_cientifico"
                            placeholder="Ej: Bemisia tabaci">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Tipo de plaga
                        </label>

                        <select class="form-select" formControlName="tipo_plaga">

                            <option value="">
                                Seleccione un tipo
                            </option>

                            @for(tipo of tiposPlaga; track tipo) {
                            <option [value]="tipo">
                                {{ tipo }}
                            </option>
                            }

                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Estado del sistema
                        </label>

                        <select class="form-select" formControlName="estado">

                            <option [ngValue]="true">
                                Activa
                            </option>

                            <option [ngValue]="false">
                                Inactiva
                            </option>

                        </select>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">
                            Descripción
                        </label>

                        <textarea class="form-control" rows="4" formControlName="descripcion"
                            placeholder="Describa daños, síntomas o cultivos afectados">
                        </textarea>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">
                            Fuente
                        </label>

                        <input type="text" class="form-control" formControlName="fuente"
                            placeholder="Fuente de información">
                    </div>

                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">

                    <button type="button" class="btn btn-outline-secondary" routerLink="/app/plagas-registradas">

                        Cancelar

                    </button>

                    <button type="submit" class="btn btn-success px-4">

                        <i class="bi bi-save me-1"></i>
                        Guardar

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
