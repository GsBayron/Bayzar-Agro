steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_TAG}

substitutions:
  _REGION: us-central1
  _REPOSITORY: bayzar-agro
  _IMAGE: web
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
