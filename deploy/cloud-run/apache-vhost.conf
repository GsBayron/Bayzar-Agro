ServerName localhost
ServerTokens Prod
ServerSignature Off
Listen 8080

<VirtualHost *:8080>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    <Directory /var/www/html/public>
        AllowOverride None
        Options -Indexes +FollowSymLinks
        Require all granted
        DirectoryIndex index.html

        RewriteEngine On

        # Laravel receives bearer tokens through the Authorization header.
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

        # API, OAuth and health requests are handled by Laravel.
        RewriteCond %{REQUEST_URI} ^/(api(?:/|$)|oauth(?:/|$)|up$)
        RewriteRule ^ index.php [END,QSA]

        # Existing Angular assets are served directly.
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [END]

        # Angular client-side routes fall back to its index.
        RewriteRule ^ index.html [END]
    </Directory>

    <FilesMatch "\.(?:css|js)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    <Files "index.html">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </Files>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(self)"
    Header always set Strict-Transport-Security "max-age=31536000"
</VirtualHost>
